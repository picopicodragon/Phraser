name: Windows VST3 build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Visual Studio x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3 Release
        run: cmake --build build --config Release --target Phraser_VST3 --parallel 4
      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Phraser-Windows-VST3
          path: build/Phraser_artefacts/Release/VST3/Phraser.vst3
          if-no-files-found: error
